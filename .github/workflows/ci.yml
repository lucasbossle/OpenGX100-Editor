# Runs on every pull request and every push to master. The "checks" job is required by the
# "Protect master" ruleset, so a PR can't be merged until it passes.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  # release.yml runs the same checks on the tagged commit before building.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Any compiler warning fails the build, the tests and clippy.
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: checks
    # macOS: the platform the app is released for (CoreMIDI, the .app bundle).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      # The tests use the synthetic fixture tables (no BOSS TONE STUDIO on the runner);
      # tests that need the real tables or the pedal are #[ignore]d or skip themselves.
      - name: Test
        run: cargo test --workspace --locked
      - name: Build (release)
        run: cargo build --workspace --release --locked
