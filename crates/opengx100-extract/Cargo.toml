[package]
name = "opengx100-extract"
version = "0.4.1"
description = "Reads the GX-100 parameter tables from an installed BOSS TONE STUDIO (embedded JavaScript engine)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
boa_engine = "0.22.0"
dirs = "7.0.0"
opengx100-protocol = { path = "../opengx100-protocol" }
# Windows keeps BOSS TONE STUDIO's html tree as a zip inside its .exe.
zip = { version = "9", default-features = false, features = ["deflate"] }
